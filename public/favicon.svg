<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- Background squircle -->
  <rect width="100" height="100" rx="26" fill="#0A0A0E" />
  <circle cx="50" cy="50" r="46" fill="url(#glow)" />
  <rect width="94" height="94" x="3" y="3" rx="23" fill="none" stroke="url(#amberGrad)" stroke-width="2.5" stroke-opacity="0.8" />
  <!-- Monogram VA -->
  <text x="50" y="65" font-family="'Anton', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="url(#amberGrad)" text-anchor="middle" letter-spacing="-1.5">VA</text>
</svg>